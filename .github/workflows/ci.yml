name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (all modules)
        run: ./gradlew test --no-daemon

      # Both flavors must compile: a change that only builds with the proprietary Cast
      # SDK present would break the F-Droid build.
      - name: Assemble full flavor
        run: ./gradlew :app:assembleFullDebug --no-daemon

      - name: Assemble FOSS flavor
        run: ./gradlew :app:assembleFossDebug --no-daemon

      # The whole point of the FOSS flavor. Fails the build if Play Services leaks in
      # via a transitive dependency.
      - name: Verify FOSS build has no Google Play Services
        run: |
          APK=$(find app/build/outputs/apk/foss/debug -name '*.apk' | head -1)
          echo "Scanning $APK"
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          GMS=$(tr -c '[:print:]' '\n' < /tmp/classes.dex | grep -c 'com/google/android/gms' || true)
          GMS=${GMS:-0}
          if [ "$GMS" -ne 0 ]; then
            echo "::error::FOSS build contains $GMS Google Play Services references"
            exit 1
          fi
          echo "OK: no com.google.android.gms references"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Instrumented tests on an emulator — catches OEM-specific breakage that unit
  # tests and a clean compile cannot see. Runs against BOTH the debug build and
  # the minified release build, because R8 breaks reflection-based code paths.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: macos-latest  # KVM acceleration; Linux emulator is slow and flaky
    strategy:
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.variant }}-${{ hashFiles('app/build.gradle.kts') }}

      - name: Create AVD and boot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          avd-name: soniccore_ci
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: echo "Emulator booted"

      - name: Boot emulator (cached)
        if: steps.avd-cache.outputs.cache-hit == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          avd-name: soniccore_ci
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: echo "Emulator booted"

      - name: Run instrumented tests (${{ matrix.variant }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          avd-name: soniccore_ci
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            ./gradlew :app:connectedFull${{ matrix.variant == 'release' && 'Release' || 'Debug' }}AndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-${{ matrix.variant }}
          path: '**/build/reports/androidTests/'

  release:
    name: Release artifacts
    needs: [verify, instrumented]
    if: startsWith(github.ref, 'refs/tags/v*')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Signing credentials come from repository secrets, never from the repo.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/soniccore-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/soniccore-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release artifacts
        run: |
          ./gradlew :app:assembleFullRelease :app:assembleFossRelease :app:bundleFullRelease --no-daemon

      - name: Stage and checksum
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*.apk   "dist/soniccore-$V-full.apk"
          cp app/build/outputs/apk/foss/release/*.apk   "dist/soniccore-$V-foss.apk"
          cp app/build/outputs/bundle/fullRelease/*.aab "dist/soniccore-$V.aab"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          draft: true

      - name: Clean up credentials
        if: always()
        run: rm -rf keystore keystore.properties
